
services:
  postgres:
    image: postgres:15
    container_name: event-service-db
    restart: always
    environment:
      POSTGRES_DB: event_service
      POSTGRES_USER: event
      POSTGRES_PASSWORD: eventpsw
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data:


services:
  postgres:
    image: postgres:15
    container_name: event-service-db
    restart: always
    environment:
      POSTGRES_DB: event_service
      POSTGRES_USER: event
      POSTGRES_PASSWORD: eventpsw
    networks:
      - bookfest-event-network
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_event:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-event
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"  # Port pour la communication entre services
      - "15672:15672" # Port du dashboard rabbitmq



volumes:
  postgres_data_event:


networks:
  bookfest-event-network :
    external: true
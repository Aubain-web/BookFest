  postgres:
    image: postgres:15
    container_name: user-service-db
    restart: always
    environment:
      POSTGRES_DB: user_service
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    networks:
      - bookfest-user-network
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_user:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-user
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5673:5672"  # Port pour la communication entre services
      - "15673:15672" # Port pour accéder au dashboard de RabbitMQ

volumes:
  postgres_data_user:


networks:
  bookfest-user-network:
    external: true